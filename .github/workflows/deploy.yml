name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual run deploys both frontend and backend

# Never run two production deploys at once; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  AMPLIFY_APP_ID: d2qpjzu9cicpu8
  AMPLIFY_BRANCH: main
  SITE_URL: https://main.d2qpjzu9cicpu8.amplifyapp.com

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - 'scripts/ci/remote_deploy.sh'
              - '.github/workflows/deploy.yml'

  deploy-backend:
    name: Deploy backend (EC2)
    needs: [ci, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy script on instance via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          params=$(jq -n --rawfile s scripts/ci/remote_deploy.sh '{commands: [$s], executionTimeout: ["1200"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub deploy ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll up to ~18 min (a dependency reinstall on t3.micro is slow)
          for _ in $(seq 1 216); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "Final status: $STATUS"
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          [ "$STATUS" = "Success" ]

      - name: Verify backend through the public site
        run: |
          for _ in $(seq 1 10); do
            curl -fsS --max-time 10 "$SITE_URL/backend/health" && exit 0
            sleep 6
          done
          echo "Backend not reachable via $SITE_URL/backend/health" && exit 1

  deploy-frontend:
    name: Deploy frontend (Amplify)
    needs: [ci, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static export
        working-directory: frontend
        run: |
          npm ci
          npm run build
          grep -q '"/backend"' -r out/_next/static/chunks/app || { echo "Build is not pointed at /backend"; exit 1; }

      - name: Package
        run: cd frontend/out && zip -qr "$GITHUB_WORKSPACE/site.zip" .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload and release on Amplify
        run: |
          set -euo pipefail
          # Clear any deployment left pending by an interrupted run
          for JOB in $(aws amplify list-jobs --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --max-results 5 \
                        --query "jobSummaries[?status=='PENDING'].jobId" --output text); do
            echo "Stopping stale pending job $JOB"
            aws amplify stop-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB" >/dev/null || true
          done

          read -r JOB_ID UPLOAD_URL < <(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --query '[jobId, zipUploadUrl]' --output text)
          echo "Amplify job: $JOB_ID"
          curl -fsS -X PUT -H 'Content-Type: application/zip' --data-binary @site.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID" >/dev/null

          for _ in $(seq 1 120); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)
            case "$STATUS" in
              SUCCEED) echo "Deployed job $JOB_ID"; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify job $JOB_ID $STATUS"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Amplify job $JOB_ID"; exit 1

      - name: Smoke test live site
        run: |
          curl -fsS --max-time 15 "$SITE_URL/" | grep -q 'Sovereign-SRE'
          curl -fsS --max-time 15 -o /dev/null -w "icon %{http_code}\n" "$SITE_URL/icon.svg"
          echo "Site is serving the new build"
