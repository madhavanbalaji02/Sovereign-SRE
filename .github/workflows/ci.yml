name: CI

# Runs on pull requests and is also called by deploy.yml before every
# production deploy, so nothing ships without passing these checks.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build static export
        run: npm run build

  backend:
    name: Backend · tests & smoke
    runs-on: ubuntu-latest
    env:
      # CPU-only torch wheels: far smaller than the default CUDA build
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # matches /usr/bin/python3.11 on the EC2 host
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest "moto[all]"

      - name: Unit tests (AWS mocked with moto)
        run: python -m pytest tests/test_aws -q -p no:cacheprovider

      - name: API smoke test
        env:
          AWS_DEFAULT_REGION: us-east-2
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.api.main import app
          r = TestClient(app).get("/health")
          print(r.status_code, r.json())
          assert r.status_code == 200 and r.json()["status"] == "healthy"
          PY
